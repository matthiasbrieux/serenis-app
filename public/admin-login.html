<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#3D5A47"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="VPM"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Vendu Par Moi</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="page-auth">
  <div class="auth-box" style="max-width:360px;" id="stepCreds">
    <h1 style="text-align:center;color:#1A1A16;margin-bottom:8px;">Administration</h1>
    <p class="auth-sub">Accès réservé</p>
    <form id="adminLoginForm">
      <div class="form-group">
        <label>Email admin</label>
        <input type="email" id="adminEmail" required placeholder="contact@venduparmoi.fr">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="adminPassword" required placeholder="••••••••">
          <button type="button" class="pwd-eye-btn" onclick="togglePwd('adminPassword', this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full" id="adminLoginBtn">Connexion</button>
      <div id="adminError" class="form-error hidden"></div>
    </form>
  </div>

  <div class="auth-box" style="max-width:360px;display:none;" id="step2fa">
    <h1 style="text-align:center;color:#1A1A16;margin-bottom:8px;">Vérification</h1>
    <p class="auth-sub">Code envoyé à <strong id="maskedEmail"></strong></p>
    <form id="twoFaForm">
      <div class="form-group">
        <label>Code à 6 chiffres</label>
        <input type="text" id="twoFaCode" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" autocomplete="one-time-code" style="letter-spacing:6px;font-size:1.3rem;text-align:center;">
      </div>
      <button type="submit" class="btn-primary btn-full" id="twoFaBtn">Vérifier</button>
      <div id="twoFaError" class="form-error hidden"></div>
    </form>
    <p style="text-align:center;margin-top:14px;"><a href="#" id="backToCreds">← Retour</a></p>
  </div>
  <script src="/js/toggle-password.js"></script>
  <script>
    let pendingToken = null;

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('adminLoginBtn');
      const err = document.getElementById('adminError');
      btn.textContent = 'Connexion...'; btn.disabled = true;
      err.classList.add('hidden');
      try {
        const res = await fetch('/admin/login', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            email: document.getElementById('adminEmail').value,
            password: document.getElementById('adminPassword').value
          })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect;
        } else if (data.requires2fa) {
          pendingToken = data.pendingToken;
          document.getElementById('maskedEmail').textContent = data.maskedEmail;
          document.getElementById('stepCreds').style.display = 'none';
          document.getElementById('step2fa').style.display = 'block';
          document.getElementById('twoFaCode').focus();
        } else {
          err.textContent = data.error; err.classList.remove('hidden');
        }
      } catch { err.textContent = 'Erreur réseau.'; err.classList.remove('hidden'); }
      btn.textContent = 'Connexion'; btn.disabled = false;
    });

    document.getElementById('twoFaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('twoFaBtn');
      const err = document.getElementById('twoFaError');
      btn.textContent = 'Vérification...'; btn.disabled = true;
      err.classList.add('hidden');
      try {
        const res = await fetch('/api/login/verify-2fa', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ pendingToken, code: document.getElementById('twoFaCode').value })
        });
        const data = await res.json();
        if (data.success) { window.location.href = data.redirect; }
        else { err.textContent = data.error; err.classList.remove('hidden'); }
      } catch { err.textContent = 'Erreur réseau.'; err.classList.remove('hidden'); }
      btn.textContent = 'Vérifier'; btn.disabled = false;
    });

    document.getElementById('backToCreds').addEventListener('click', (e) => {
      e.preventDefault();
      pendingToken = null;
      document.getElementById('step2fa').style.display = 'none';
      document.getElementById('stepCreds').style.display = 'block';
      document.getElementById('twoFaCode').value = '';
    });
  </script>
</body>
</html>
