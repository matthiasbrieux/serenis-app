<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#9E3A18"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="VPM"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Vendu Par Moi</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=5">
</head>
<body class="page-auth">
  <div class="auth-logo-top">
    <a href="/"><img src="/images/vendu-par-moi.svg" alt="Vendu Par Moi" style="width:240px;height:auto;display:block;margin:0 auto;"></a>
  </div>
  <div class="auth-box" id="stepCreds">
    <h1>Espace vendeur</h1>
    <p class="auth-sub">Connectez-vous pour accéder à vos outils</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="votre@email.fr" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pwd-eye-btn" onclick="togglePwd('loginPassword', this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full" id="loginBtn">Me connecter</button>
      <div id="loginError" class="form-error hidden"></div>
    </form>
    <div class="auth-footer">
      <p><a href="/reset-password">Mot de passe oublié ?</a></p>
      <p style="margin-top:8px;">Pas encore de compte ? <a href="#offres-home" onclick="window.location='/#offres'">Choisir une offre →</a></p>
      <p style="margin-top:8px;">Une question ? <strong>06 95 44 36 54</strong></p>
    </div>
  </div>

  <div class="auth-box" id="step2fa" style="display:none;">
    <h1>Vérification</h1>
    <p class="auth-sub">Code envoyé à <strong id="maskedEmail"></strong></p>
    <form id="twoFaForm">
      <div class="form-group">
        <label>Code à 6 chiffres</label>
        <input type="text" id="twoFaCode" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" autocomplete="one-time-code" style="letter-spacing:6px;font-size:1.3rem;text-align:center;">
      </div>
      <button type="submit" class="btn-primary btn-full" id="twoFaBtn">Vérifier</button>
      <div id="twoFaError" class="form-error hidden"></div>
    </form>
    <div class="auth-footer">
      <p><a href="#" id="backToCreds">← Retour</a></p>
    </div>
  </div>
  <script src="/js/toggle-password.js"></script>
  <script>
    let pendingToken = null;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.textContent = 'Connexion...'; btn.disabled = true;
      err.classList.add('hidden');
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect;
        } else if (data.requires2fa) {
          pendingToken = data.pendingToken;
          document.getElementById('maskedEmail').textContent = data.maskedEmail;
          document.getElementById('stepCreds').style.display = 'none';
          document.getElementById('step2fa').style.display = 'block';
          document.getElementById('twoFaCode').focus();
        } else {
          err.textContent = data.error; err.classList.remove('hidden');
        }
      } catch { err.textContent = 'Erreur réseau.'; err.classList.remove('hidden'); }
      btn.textContent = 'Me connecter'; btn.disabled = false;
    });

    document.getElementById('twoFaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('twoFaBtn');
      const err = document.getElementById('twoFaError');
      btn.textContent = 'Vérification...'; btn.disabled = true;
      err.classList.add('hidden');
      try {
        const res = await fetch('/api/login/verify-2fa', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ pendingToken, code: document.getElementById('twoFaCode').value })
        });
        const data = await res.json();
        if (data.success) { window.location.href = data.redirect; }
        else { err.textContent = data.error; err.classList.remove('hidden'); }
      } catch { err.textContent = 'Erreur réseau.'; err.classList.remove('hidden'); }
      btn.textContent = 'Vérifier'; btn.disabled = false;
    });

    document.getElementById('backToCreds').addEventListener('click', (e) => {
      e.preventDefault();
      pendingToken = null;
      document.getElementById('step2fa').style.display = 'none';
      document.getElementById('stepCreds').style.display = 'block';
      document.getElementById('twoFaCode').value = '';
    });
  </script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
