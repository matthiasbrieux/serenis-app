<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon compte — Admin VPM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body { background: #f0f0ed; }
    
    
    .admin-main { padding: 32px; }
    
    
    
    .card { background: #fff; border-radius: 12px; padding: 32px; max-width: 480px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: #C4603A; }
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 44px; }
    .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #aaa; padding: 4px; line-height: 1; }
    .eye-btn:hover { color: #555; }
    .btn-save { background: #C4603A; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-save:hover { background: #a84f2e; }
    .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; display: none; }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.error { background: #fdecea; color: #c62828; display: block; }
    .info-row { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #f0f0f0; }
    .info-label { font-size: 0.83rem; color: #888; }
    .info-value { font-size: 0.95rem; font-weight: 600; color: #1A1A16; }
  </style>
</head>
<body class="admin-body">
<div class="admin-layout">
  <div id="admin-sidebar-slot"></div>
  <main class="admin-main">
    <h1 style="font-family:'Cormorant Garamond',serif;color:#1A1A16;font-size:2rem;margin-bottom:28px;">Mon compte</h1>

    <div class="card">
      <div class="info-row">
        <div>
          <div class="info-label">Connecté en tant que</div>
          <div class="info-value" id="admin-name">—</div>
          <div class="info-label" id="admin-email" style="margin-top:2px;">—</div>
        </div>
      </div>

      <div id="msg" class="msg"></div>

      <form id="pwd-form">
        <div class="form-group">
          <label>Mot de passe actuel</label>
          <div class="input-wrap">
            <input type="password" id="current" required autocomplete="current-password">
            <button type="button" class="eye-btn" onclick="togglePwd('current', this)">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label>Nouveau mot de passe</label>
          <div class="input-wrap">
            <input type="password" id="newpwd" required minlength="8" autocomplete="new-password">
            <button type="button" class="eye-btn" onclick="togglePwd('newpwd', this)">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirmer le nouveau mot de passe</label>
          <div class="input-wrap">
            <input type="password" id="confirm" required autocomplete="new-password">
            <button type="button" class="eye-btn" onclick="togglePwd('confirm', this)">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-save">Changer le mot de passe</button>
      </form>
    </div>
  </main>
</div>

<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

// Affiche le nom/email depuis le token (décodé côté serveur via la page)
fetch('/admin/api/me').then(r => r.json()).then(d => {
  if (d.name) document.getElementById('admin-name').textContent = d.name;
  if (d.email) document.getElementById('admin-email').textContent = d.email;
});

document.getElementById('pwd-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';

  const current = document.getElementById('current').value;
  const newpwd  = document.getElementById('newpwd').value;
  const confirm = document.getElementById('confirm').value;

  if (newpwd !== confirm) {
    msg.className = 'msg error';
    msg.textContent = 'Les deux nouveaux mots de passe ne correspondent pas.';
    return;
  }
  if (newpwd.length < 8) {
    msg.className = 'msg error';
    msg.textContent = 'Le mot de passe doit faire au moins 8 caractères.';
    return;
  }

  const r = await fetch('/admin/api/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ current, newpwd }),
  });
  const data = await r.json();
  if (data.success) {
    msg.className = 'msg success';
    msg.textContent = 'Mot de passe mis à jour avec succès.';
    document.getElementById('pwd-form').reset();
  } else {
    msg.className = 'msg error';
    msg.textContent = data.error || 'Erreur inconnue.';
  }
});
</script>
<script src="/js/admin-sidebar.js"></script>
</body>
</html>
