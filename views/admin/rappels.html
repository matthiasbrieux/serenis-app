<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rappels — Vendu Par Moi Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    /* Stats row */
    .stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px; }
    .stat-box { background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .stat-box .lbl { font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#9a9087;margin-bottom:6px; }
    .stat-box .val { font-size:1.8rem;font-weight:700;font-family:'Cormorant Garamond',serif; }
    .val-orange { color:#d97706; }
    .val-red    { color:#dc2626; }
    .val-green  { color:#059669; }
    .val-muted  { color:#9a9087; }

    /* Alertes today */
    .alert-today { background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #f59e0b;border-radius:12px;padding:16px 20px;margin-bottom:22px;display:flex;align-items:center;gap:14px; }
    .alert-today .icon { font-size:1.5rem;flex-shrink:0; }
    .alert-today .txt { flex:1;font-size:.88rem;color:#92400e;font-weight:600; }
    .alert-today .btn-link { font-size:.82rem;font-weight:700;color:#92400e;border:1.5px solid #f59e0b;background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;white-space:nowrap; }
    .alert-today .btn-link:hover { background:#f59e0b;color:#fff; }
    .alert-retard { background:linear-gradient(135deg,#fef2f2,#fee2e2);border:1px solid #f87171;border-radius:12px;padding:14px 20px;margin-bottom:14px;display:flex;align-items:center;gap:12px; }
    .alert-retard .txt { font-size:.85rem;color:#7f1d1d;font-weight:600; }

    /* Table */
    .table-card { background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden; }
    .table-header { padding:14px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap; }
    .table-header h2 { font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:#1A1A16; }
    .search-input { border:1px solid #e8e0d6;border-radius:7px;padding:6px 12px;font-size:.82rem;font-family:'DM Sans',sans-serif;width:200px;outline:none; }
    .search-input:focus { border-color:#C4603A; }
    .filter-btns { display:flex;gap:6px; }
    .filter-btn { font-size:.75rem;font-weight:600;padding:5px 12px;border-radius:20px;border:1.5px solid #e8e0d6;background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;color:#555;transition:all .12s; }
    .filter-btn.active { border-color:#C4603A;background:#C4603A;color:#fff; }
    .filter-btn:hover:not(.active) { border-color:#C4603A;color:#C4603A; }

    /* Main table */
    table { width:100%;border-collapse:collapse;font-size:.82rem; }
    thead th { background:#F9F8F5;padding:9px 14px;text-align:left;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9a9087;border-bottom:1px solid #eee;white-space:nowrap; }
    tbody td { padding:10px 14px;border-bottom:1px solid #f5f0e8;vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:#fdf9f6; }
    tbody tr.today-due td { background:#fffbeb; }
    tbody tr.today-due:hover td { background:#fef3c7; }
    tbody tr.retard td { background:#fff7f7; }
    tbody tr.retard:hover td { background:#fee2e2; }

    .nom-cell strong { font-size:.85rem;color:#1A1A16; }
    .nom-cell .type-tag { display:inline-block;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle; }
    .tag-contact { background:#dbeafe;color:#1d4ed8; }
    .tag-rappel  { background:#f3e8ff;color:#6d28d9; }
    .tel-link { color:#C4603A;font-weight:600;text-decoration:none;white-space:nowrap; }
    .tel-link:hover { text-decoration:underline; }
    .mail-link { color:#555;font-size:.75rem;text-decoration:none; }
    .mail-link:hover { color:#C4603A; }
    .message-cell { max-width:160px;color:#555;font-style:italic;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

    /* Date de rappel */
    .date-input { border:1px solid #e8e0d6;border-radius:6px;padding:4px 8px;font-size:.78rem;font-family:'DM Sans',sans-serif;outline:none;background:#fff;width:120px;cursor:pointer; }
    .date-input:focus { border-color:#C4603A; }
    .date-input.has-date { border-color:#d97706;color:#92400e;background:#fffbeb; }
    .date-input.overdue { border-color:#dc2626;color:#7f1d1d;background:#fef2f2; }

    /* Notes */
    .notes-input { border:1px solid #e8e0d6;border-radius:6px;padding:4px 8px;font-size:.78rem;font-family:'DM Sans',sans-serif;outline:none;background:#fff;width:100%;min-width:120px;resize:none;height:36px; }
    .notes-input:focus { border-color:#C4603A; }

    /* Statut */
    .statut-select { border:1px solid #e8e0d6;border-radius:6px;padding:4px 8px;font-size:.75rem;font-family:'DM Sans',sans-serif;outline:none;background:#fff;cursor:pointer;font-weight:600; }
    .statut-select:focus { border-color:#C4603A; }
    .statut-select.s-a_traiter,
    .statut-select.s-a_rappeler { border-color:#f59e0b;color:#92400e;background:#fffbeb; }
    .statut-select.s-rappele   { border-color:#3b82f6;color:#1d4ed8;background:#eff6ff; }
    .statut-select.s-traite,
    .statut-select.s-converti  { border-color:#059669;color:#065f46;background:#ecfdf5; }
    .statut-select.s-sans_suite { border-color:#9ca3af;color:#6b7280;background:#f9fafb; }

    /* Actions */
    .del-btn { border:1px solid #e8e0d6;background:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:#dc2626;transition:all .12s; }
    .del-btn:hover { border-color:#dc2626;background:#fef2f2; }

    .save-icon { display:none;width:18px;height:18px;color:#059669;margin-left:6px;vertical-align:middle;animation:fadeOut 2s forwards; }
    @keyframes fadeOut { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

    .empty { padding:40px;text-align:center;color:#9a9087;font-size:.88rem; }
  </style>
</head>
<body class="admin-body">
<div class="admin-layout">
  <div id="admin-sidebar-slot"></div>

  <main class="admin-main">
    <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:24px;">
      <h1 class="adm-page-title" style="margin:0;">Rappels</h1>
      <span id="live-count" style="font-size:.8rem;color:#9a9087;"></span>
    </div>

    <!-- Alertes -->
    <div id="alert-today" style="display:none;" class="alert-today">
      <div class="icon">🔔</div>
      <div class="txt" id="alert-today-txt"></div>
      <button class="btn-link" onclick="setFilter('today')">Voir →</button>
    </div>
    <div id="alert-retard" style="display:none;" class="alert-retard">
      <div class="txt" id="alert-retard-txt"></div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box"><div class="lbl">À traiter</div><div class="val val-orange" id="stat-pending">—</div></div>
      <div class="stat-box"><div class="lbl">Rappel aujourd'hui</div><div class="val val-red" id="stat-today">—</div></div>
      <div class="stat-box"><div class="lbl">Traités</div><div class="val val-green" id="stat-done">—</div></div>
      <div class="stat-box"><div class="lbl">Total</div><div class="val val-muted" id="stat-total">—</div></div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-header">
        <h2>Toutes les demandes</h2>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <div class="filter-btns">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Tous</button>
            <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">À traiter</button>
            <button class="filter-btn" data-filter="today" onclick="setFilter('today')">Aujourd'hui</button>
            <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Traités</button>
          </div>
          <input class="search-input" type="search" placeholder="Nom, téléphone…" id="search-input" oninput="render()">
        </div>
      </div>
      <div style="overflow-x:auto;">
        <div id="table-wrap"><div class="empty">Chargement…</div></div>
      </div>
    </div>
  </main>
</div>

<script>
  let allLeads = [];
  let activeFilter = 'all';
  const today = new Date().toISOString().slice(0, 10);

  async function load() {
    const data = await fetch('/admin/api/leads').then(r => r.json());
    allLeads = data.leads || [];

    // Stats
    const pending = allLeads.filter(r => !isDone(r)).length;
    const todayDue = allLeads.filter(r => !isDone(r) && r.rappel_prevu_le && r.rappel_prevu_le <= today).length;
    const retard   = allLeads.filter(r => !isDone(r) && r.rappel_prevu_le && r.rappel_prevu_le < today).length;
    const done     = allLeads.filter(r => isDone(r)).length;

    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-today').textContent   = todayDue;
    document.getElementById('stat-done').textContent    = done;
    document.getElementById('stat-total').textContent   = allLeads.length;
    document.getElementById('live-count').textContent   = pending > 0 ? `${pending} à traiter` : 'Tout traité ✓';

    // Alertes
    const alertToday = document.getElementById('alert-today');
    const alertRetard = document.getElementById('alert-retard');
    if (todayDue > 0) {
      alertToday.style.display = 'flex';
      document.getElementById('alert-today-txt').textContent = `${todayDue} rappel${todayDue > 1 ? 's' : ''} prévu${todayDue > 1 ? 's' : ''} aujourd'hui`;
    } else {
      alertToday.style.display = 'none';
    }
    if (retard > 0) {
      alertRetard.style.display = 'flex';
      document.getElementById('alert-retard-txt').textContent = `⚠️ ${retard} rappel${retard > 1 ? 's' : ''} en retard`;
    } else {
      alertRetard.style.display = 'none';
    }

    render();
  }

  function isDone(r) {
    return ['traite', 'sans_suite', 'converti'].includes(r.statut);
  }

  function setFilter(f) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === f);
    });
    render();
  }

  function getVisible() {
    const q = (document.getElementById('search-input')?.value || '').toLowerCase();
    let rows = allLeads;

    if (activeFilter === 'pending') rows = rows.filter(r => !isDone(r));
    else if (activeFilter === 'today') rows = rows.filter(r => !isDone(r) && r.rappel_prevu_le && r.rappel_prevu_le <= today);
    else if (activeFilter === 'done') rows = rows.filter(r => isDone(r));

    if (q) rows = rows.filter(r =>
      (r.nom || '').toLowerCase().includes(q) ||
      (r.telephone || '').toLowerCase().includes(q) ||
      (r.email || '').toLowerCase().includes(q)
    );

    // Tri : retard → today → pending sans date → done
    return rows.sort((a, b) => {
      const rank = r => {
        if (isDone(r)) return 4;
        if (r.rappel_prevu_le && r.rappel_prevu_le < today) return 1;
        if (r.rappel_prevu_le && r.rappel_prevu_le === today) return 2;
        return 3;
      };
      return rank(a) - rank(b) || new Date(b.created_at) - new Date(a.created_at);
    });
  }

  function render() {
    const rows = getVisible();
    const wrap = document.getElementById('table-wrap');
    if (!rows.length) {
      wrap.innerHTML = '<div class="empty">Aucune demande pour ce filtre.</div>';
      return;
    }
    wrap.innerHTML = `<table>
      <thead><tr>
        <th>Nom</th>
        <th>Contact</th>
        <th>Message</th>
        <th>Date de rappel</th>
        <th>Commentaire</th>
        <th>Statut</th>
        <th style="width:60px;"></th>
      </tr></thead>
      <tbody>${rows.map(row => {
        const isToday   = !isDone(row) && row.rappel_prevu_le === today;
        const isRetard  = !isDone(row) && row.rappel_prevu_le && row.rappel_prevu_le < today;
        const rowClass  = isRetard ? 'retard' : isToday ? 'today-due' : '';
        const dateClass = row.rappel_prevu_le
          ? (isRetard ? 'date-input overdue' : isToday ? 'date-input has-date' : 'date-input has-date')
          : 'date-input';
        const tag = row.source_type === 'contact'
          ? '<span class="type-tag tag-contact">Contact</span>'
          : '<span class="type-tag tag-rappel">Rappel</span>';
        const statuts = row.source_type === 'contact'
          ? [['a_traiter','⏳ À traiter'],['rappele','📞 Rappelé'],['traite','✅ Traité'],['sans_suite','— Sans suite']]
          : [['a_rappeler','⏳ À rappeler'],['rappele','📞 Rappelé'],['converti','✅ Converti'],['sans_suite','— Sans suite']];
        const opts = statuts.map(([v,l]) => `<option value="${v}" ${row.statut===v?'selected':''}>${l}</option>`).join('');
        return `<tr class="${rowClass}" id="row-${row.source_type}-${row.id}">
          <td class="nom-cell"><strong>${esc(row.nom) || '—'}</strong>${tag}</td>
          <td>
            ${row.telephone ? `<div><a class="tel-link" href="tel:${esc(row.telephone)}">${esc(row.telephone)}</a></div>` : ''}
            ${row.email ? `<div><a class="mail-link" href="mailto:${esc(row.email)}">${esc(row.email)}</a></div>` : ''}
          </td>
          <td class="message-cell" title="${esc(row.message)}">${esc(row.message) || '<span style="color:#ccc">—</span>'}</td>
          <td>
            <input type="date" class="${dateClass}" value="${row.rappel_prevu_le || ''}"
              onchange="patch('${row.source_type}',${row.id},{rappel_prevu_le:this.value})"
            >
          </td>
          <td>
            <textarea class="notes-input" placeholder="Note libre…"
              onblur="patch('${row.source_type}',${row.id},{notes:this.value})"
            >${esc(row.notes)}</textarea>
          </td>
          <td>
            <select class="statut-select s-${row.statut}"
              onchange="patch('${row.source_type}',${row.id},{statut:this.value});this.className='statut-select s-'+this.value;updateRow('${row.source_type}',${row.id})">
              ${opts}
            </select>
          </td>
          <td>
            <button class="del-btn" onclick="del('${row.source_type}',${row.id})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
  }

  async function patch(type, id, fields) {
    const lead = allLeads.find(r => r.source_type === type && r.id === id);
    if (!lead) return;
    Object.assign(lead, fields);
    await fetch(`/admin/api/leads/${type}/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fields),
    });
    // Re-render stats + alertes sans casser le focus clavier
    updateStats();
  }

  async function del(type, id) {
    if (!confirm('Supprimer cette demande ?')) return;
    const row = document.getElementById(`row-${type}-${id}`);
    if (row) { row.style.opacity = '.4'; row.style.pointerEvents = 'none'; }
    await fetch(`/admin/api/leads/${type}/${id}`, { method: 'DELETE' });
    allLeads = allLeads.filter(r => !(r.source_type === type && r.id === id));
    render();
    updateStats();
  }

  function updateRow(type, id) {
    setTimeout(() => {
      const lead = allLeads.find(r => r.source_type === type && r.id === id);
      if (!lead) return;
      const row = document.getElementById(`row-${type}-${id}`);
      if (!row) return;
      const done = isDone(lead);
      const isToday  = !done && lead.rappel_prevu_le === today;
      const isRetard = !done && lead.rappel_prevu_le && lead.rappel_prevu_le < today;
      row.className = isRetard ? 'retard' : isToday ? 'today-due' : '';
    }, 50);
  }

  function updateStats() {
    const pending = allLeads.filter(r => !isDone(r)).length;
    const todayDue = allLeads.filter(r => !isDone(r) && r.rappel_prevu_le && r.rappel_prevu_le <= today).length;
    const retard   = allLeads.filter(r => !isDone(r) && r.rappel_prevu_le && r.rappel_prevu_le < today).length;
    const done     = allLeads.filter(r => isDone(r)).length;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-today').textContent   = todayDue;
    document.getElementById('stat-done').textContent    = done;
    document.getElementById('stat-total').textContent   = allLeads.length;
    document.getElementById('live-count').textContent   = pending > 0 ? `${pending} à traiter` : 'Tout traité ✓';

    const alertToday  = document.getElementById('alert-today');
    const alertRetard = document.getElementById('alert-retard');
    if (todayDue > 0) {
      alertToday.style.display = 'flex';
      document.getElementById('alert-today-txt').textContent = `${todayDue} rappel${todayDue > 1 ? 's' : ''} prévu${todayDue > 1 ? 's' : ''} aujourd'hui`;
    } else { alertToday.style.display = 'none'; }
    if (retard > 0) {
      alertRetard.style.display = 'flex';
      document.getElementById('alert-retard-txt').textContent = `⚠️ ${retard} rappel${retard > 1 ? 's' : ''} en retard`;
    } else { alertRetard.style.display = 'none'; }
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(s) {
    if (!s) return '—';
    return new Date(s).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  load();
  setInterval(load, 60000);
</script>
<script src="/js/admin-sidebar.js"></script>
</body>
</html>
