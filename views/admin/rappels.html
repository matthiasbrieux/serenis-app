<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rappels — Vendu Par Moi Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px; }
    .stat-box { background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .stat-box .lbl { font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#9a9087;margin-bottom:6px; }
    .stat-box .val { font-size:1.8rem;font-weight:700;font-family:'Cormorant Garamond',serif; }
    .val-orange { color:#d97706; }
    .val-green  { color:#059669; }
    .val-blue   { color:#2563eb; }

    .table-card { background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden; }
    .table-header { padding:14px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:12px; }
    .table-header h2 { font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:#1A1A16; }
    .search-input { border:1px solid #e8e0d6;border-radius:7px;padding:6px 12px;font-size:.82rem;font-family:'DM Sans',sans-serif;width:220px;outline:none; }
    .search-input:focus { border-color:#C4603A; }

    table { width:100%;border-collapse:collapse;font-size:.82rem; }
    thead th { background:#F9F8F5;padding:9px 14px;text-align:left;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9a9087;border-bottom:1px solid #eee;white-space:nowrap; }
    tbody td { padding:11px 14px;border-bottom:1px solid #f5f0e8;vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:#fdf9f6; }

    .badge { display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700; }
    .badge-orange { background:#fef3c7;color:#d97706; }
    .badge-green  { background:#ecfdf5;color:#059669; }
    .badge-blue   { background:#dbeafe;color:#2563eb; }
    .badge-gray   { background:#f0ede9;color:#9a9087; }

    .tel-link { color:#C4603A;font-weight:600;text-decoration:none; }
    .tel-link:hover { text-decoration:underline; }

    .action-btn { border:1px solid #e8e0d6;background:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:#555;transition:all .12s; }
    .action-btn:hover { border-color:#C4603A;color:#C4603A; }
    .action-btn.danger:hover { border-color:#dc2626;color:#dc2626; }

    .empty { padding:40px;text-align:center;color:#9a9087;font-size:.88rem; }

    /* Modal */
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:#fff;border-radius:14px;padding:28px;width:460px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.18); }
    .modal h3 { font-family:'Cormorant Garamond',serif;font-size:1.4rem;margin-bottom:6px;color:#1A1A16; }
    .modal .contact-info { font-size:.9rem;color:#555;margin-bottom:20px;padding:12px 14px;background:#fdf9f6;border-radius:8px;border-left:3px solid #C4603A; }
    .modal label { display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9a9087;margin-bottom:5px;margin-top:14px; }
    .modal select, .modal textarea { width:100%;border:1px solid #e8e0d6;border-radius:7px;padding:8px 12px;font-size:.85rem;font-family:'DM Sans',sans-serif;outline:none;background:#fff; }
    .modal select:focus, .modal textarea:focus { border-color:#C4603A; }
    .modal textarea { resize:vertical;min-height:70px; }
    .modal-actions { display:flex;gap:10px;margin-top:20px; }
    .btn-save { flex:1;background:#C4603A;color:#fff;border:none;padding:10px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif; }
    .btn-save:hover { background:#a84f2e; }
    .btn-cancel { flex:1;background:#F5F0E8;color:#1A1A16;border:1px solid #e8e0d6;padding:10px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif; }
  </style>
</head>
<body class="admin-body">
<div class="admin-layout">
  <div id="admin-sidebar-slot"></div>

  <main class="admin-main">
    <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:28px;">
      <h1 class="adm-page-title" style="margin:0;">Rappels</h1>
      <span id="live-count" style="font-size:.8rem;color:#9a9087;"></span>
    </div>

    <div class="stats-row">
      <div class="stat-box"><div class="lbl">À rappeler</div><div class="val val-orange" id="stat-a">—</div></div>
      <div class="stat-box"><div class="lbl">Rappelés</div><div class="val val-green" id="stat-r">—</div></div>
      <div class="stat-box"><div class="lbl">Convertis</div><div class="val val-blue" id="stat-c">—</div></div>
      <div class="stat-box"><div class="lbl">Total</div><div class="val" id="stat-t">—</div></div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h2>Toutes les demandes</h2>
        <input class="search-input" type="search" placeholder="Rechercher…" id="search-input" oninput="filterTable()">
      </div>
      <div id="table-wrap">
        <div class="empty">Chargement…</div>
      </div>
    </div>
  </main>
</div>

<!-- Modal édition -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Mettre à jour le statut</h3>
    <div class="contact-info" id="modal-contact"></div>
    <label>Statut</label>
    <select id="modal-statut">
      <option value="a_rappeler">📞 À rappeler</option>
      <option value="rappele">✅ Rappelé</option>
      <option value="converti">🎉 Converti (a souscrit)</option>
      <option value="sans_suite">❌ Sans suite</option>
    </select>
    <label>Notes internes</label>
    <textarea id="modal-notes" placeholder="Observations, heure de rappel, résultat de l'appel…"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveModal()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
  let allRows = [];
  let editingId = null;

  async function load() {
    const data = await fetch('/admin/api/rappels').then(r => r.json());
    allRows = data.rows;
    document.getElementById('stat-a').textContent = data.stats.a_rappeler;
    document.getElementById('stat-r').textContent = data.stats.rappele;
    document.getElementById('stat-c').textContent = data.stats.converti;
    document.getElementById('stat-t').textContent = data.stats.total;
    document.getElementById('live-count').textContent = data.stats.a_rappeler > 0 ? `${data.stats.a_rappeler} à rappeler` : 'Tout traité ✓';
    renderTable(allRows);
  }

  function renderTable(rows) {
    const wrap = document.getElementById('table-wrap');
    if (!rows.length) {
      wrap.innerHTML = '<div class="empty">Aucune demande de rappel pour l\'instant.</div>';
      return;
    }
    wrap.innerHTML = `<table>
      <thead><tr>
        <th>Date</th><th>Nom</th><th>Téléphone</th><th>Moment souhaité</th><th>Statut</th><th>Notes</th><th>Actions</th>
      </tr></thead>
      <tbody>${rows.map(row => `
        <tr>
          <td style="font-size:.75rem;color:#9a9087;">${fmtDate(row.created_at)}</td>
          <td><strong>${esc(row.prenom)} ${esc(row.nom)}</strong></td>
          <td><a class="tel-link" href="tel:${esc(row.telephone)}">${esc(row.telephone)}</a></td>
          <td>${row.moment ? esc(row.moment) : '<span style="color:#ccc">—</span>'}</td>
          <td>${mkBadge(row.statut)}</td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#555">${row.notes ? esc(row.notes) : '<span style="color:#ccc">—</span>'}</td>
          <td>
            <div style="display:flex;gap:6px;">
              <button class="action-btn" onclick="openModal(${row.id})">Modifier</button>
              <button class="action-btn danger" onclick="del(${row.id})">Suppr.</button>
            </div>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  }

  function mkBadge(s) {
    const map = { a_rappeler:['badge-orange','📞 À rappeler'], rappele:['badge-green','✅ Rappelé'], converti:['badge-blue','🎉 Converti'], sans_suite:['badge-gray','❌ Sans suite'] };
    const [cls, lbl] = map[s] || ['badge-gray', s];
    return `<span class="badge ${cls}">${lbl}</span>`;
  }

  function fmtDate(s) {
    if (!s) return '—';
    return new Date(s).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function filterTable() {
    const q = document.getElementById('search-input').value.toLowerCase();
    renderTable(allRows.filter(r =>
      (r.nom||'').toLowerCase().includes(q) || (r.prenom||'').toLowerCase().includes(q) || (r.telephone||'').toLowerCase().includes(q)
    ));
  }

  function openModal(id) {
    const row = allRows.find(r => r.id === id);
    if (!row) return;
    editingId = id;
    document.getElementById('modal-contact').innerHTML =
      `<strong>${esc(row.prenom)} ${esc(row.nom)}</strong><br>
       📞 <a class="tel-link" href="tel:${esc(row.telephone)}">${esc(row.telephone)}</a>
       ${row.moment ? ` · Rappeler : <strong>${esc(row.moment)}</strong>` : ''}`;
    document.getElementById('modal-statut').value = row.statut || 'a_rappeler';
    document.getElementById('modal-notes').value = row.notes || '';
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    editingId = null;
  }

  async function saveModal() {
    if (!editingId) return;
    await fetch(`/admin/api/rappels/${editingId}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ statut: document.getElementById('modal-statut').value, notes: document.getElementById('modal-notes').value })
    });
    closeModal();
    await load();
  }

  async function del(id) {
    if (!confirm('Supprimer cette demande ?')) return;
    await fetch(`/admin/api/rappels/${id}`, { method:'DELETE' });
    await load();
  }

  document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

  load();
  setInterval(load, 30000);
</script>
<script src="/js/admin-sidebar.js"></script>
</body>
</html>
