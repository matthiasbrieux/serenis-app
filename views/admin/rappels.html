<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rappels — Vendu Par Moi Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    /* ── Stats ─────────────────────────────────────────────── */
    .stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px; }
    .stat-box { background:#fff;border-radius:10px;padding:14px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .stat-box .lbl { font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#9a9087;margin-bottom:4px; }
    .stat-box .val { font-size:1.7rem;font-weight:700;font-family:'Cormorant Garamond',serif; }

    /* ── Alertes ────────────────────────────────────────────── */
    .alert-banner { border-radius:10px;padding:12px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px; }
    .alert-banner .icon { font-size:1.1rem;flex-shrink:0; }
    .alert-banner .txt { flex:1;font-size:.85rem;font-weight:600; }
    .alert-overdue { background:#fef2f2;border:1px solid #f87171;color:#7f1d1d; }
    .alert-today   { background:#fffbeb;border:1px solid #f59e0b;color:#92400e; }
    .alert-rdv     { background:#faf5ff;border:1px solid #a78bfa;color:#5b21b6; }
    .alert-banner a { color:inherit;font-weight:700;text-decoration:underline;cursor:pointer; }

    /* ── Table card ─────────────────────────────────────────── */
    .table-card { background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden; }
    .table-head { padding:14px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap; }
    .table-head h2 { font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;color:#1A1A16;margin:0; }
    .filter-row { display:flex;flex-wrap:wrap;gap:6px;align-items:center; }
    .fb { font-size:.73rem;font-weight:600;padding:4px 11px;border-radius:20px;border:1.5px solid #e8e0d6;background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;color:#555;transition:all .12s;white-space:nowrap; }
    .fb:hover:not(.fb-active) { border-color:#C4603A;color:#C4603A; }
    .fb.fb-active { background:#C4603A;border-color:#C4603A;color:#fff; }
    .search-inp { border:1px solid #e8e0d6;border-radius:7px;padding:5px 11px;font-size:.8rem;font-family:'DM Sans',sans-serif;width:180px;outline:none; }
    .search-inp:focus { border-color:#C4603A; }

    /* ── Table ──────────────────────────────────────────────── */
    table { width:100%;border-collapse:collapse;font-size:.82rem; }
    thead th { background:#F9F8F5;padding:9px 12px;text-align:left;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9a9087;border-bottom:1px solid #eee;white-space:nowrap; }
    tbody td { padding:9px 12px;border-bottom:1px solid #f5f0e8;vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }

    /* Row states */
    tr.row-overdue td { background:#fef2f2; }
    tr.row-today   td { background:#fffbeb; }
    tr.row-rdv     td { background:#faf5ff; }
    tr.row-overdue:hover td { background:#fee2e2; }
    tr.row-today:hover   td { background:#fef3c7; }
    tr.row-rdv:hover     td { background:#f3e8ff; }
    tbody tr:not(.row-overdue):not(.row-today):not(.row-rdv):hover td { background:#fdf9f6; }

    /* Type tags */
    .type-tag { display:inline-block;font-size:.63rem;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:5px;vertical-align:middle; }
    .tag-contact { background:#dbeafe;color:#1d4ed8; }
    .tag-rappel  { background:#ede9fe;color:#6d28d9; }

    /* Contact links */
    .tel-link { color:#C4603A;font-weight:600;text-decoration:none;white-space:nowrap;font-size:.82rem; }
    .tel-link:hover { text-decoration:underline; }
    .mail-link { color:#7a7065;font-size:.73rem;text-decoration:none; }
    .mail-link:hover { color:#C4603A; }

    /* Message cell */
    .msg-cell { max-width:140px;color:#6b6965;font-style:italic;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

    /* Date cell */
    .date-lbl { font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px; }
    .lbl-rappel { color:#d97706; }
    .lbl-rdv    { color:#7c3aed; }
    .date-inp { border:1px solid #e8e0d6;border-radius:6px;padding:4px 7px;font-size:.76rem;font-family:'DM Sans',sans-serif;outline:none;background:#fff;width:122px;cursor:pointer; }
    .date-inp:focus { border-color:#C4603A; }
    .date-inp.di-overdue { border-color:#dc2626;color:#7f1d1d;background:#fef2f2; }
    .date-inp.di-today   { border-color:#d97706;color:#92400e;background:#fffbeb; }
    .date-inp.di-future  { border-color:#d97706;color:#92400e; }
    .date-inp.di-rdv-soon { border-color:#7c3aed;color:#5b21b6;background:#faf5ff; }
    .date-inp.di-rdv-future { border-color:#a78bfa;color:#5b21b6; }

    /* Notes */
    .notes-ta { border:1px solid #e8e0d6;border-radius:6px;padding:4px 8px;font-size:.76rem;font-family:'DM Sans',sans-serif;outline:none;background:#fff;width:100%;min-width:100px;resize:none;height:34px;box-sizing:border-box; }
    .notes-ta:focus { border-color:#C4603A; }

    /* Statut select */
    .stat-sel { border-radius:7px;padding:4px 8px;font-size:.76rem;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;font-weight:600;border-width:1.5px;border-style:solid;transition:background .1s; }
    .stat-sel:focus { outline:none; }
    .s-a_traiter  { background:#fff8f0;color:#C4603A;  border-color:#e8c4b0; }
    .s-a_rappeler { background:#fffbeb;color:#d97706;  border-color:#f59e0b; }
    .s-rappele    { background:#eff6ff;color:#1d4ed8;  border-color:#93c5fd; }
    .s-rdv_prevu  { background:#faf5ff;color:#7c3aed;  border-color:#a78bfa; }
    .s-traite     { background:#ecfdf5;color:#065f46;  border-color:#6ee7b7; }
    .s-sans_suite { background:#f9fafb;color:#6b7280;  border-color:#d1d5db; }

    /* Delete btn */
    .del-btn { border:1px solid #e8e0d6;background:#fff;padding:5px 8px;border-radius:6px;cursor:pointer;color:#9a9087;line-height:1;transition:all .12s;display:flex;align-items:center; }
    .del-btn:hover { border-color:#dc2626;background:#fef2f2;color:#dc2626; }

    .empty { padding:40px;text-align:center;color:#9a9087;font-size:.88rem; }
  </style>
</head>
<body class="admin-body">
<div class="admin-layout">
  <div id="admin-sidebar-slot"></div>

  <main class="admin-main">
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:20px;">
      <h1 class="adm-page-title" style="margin:0;">Rappels</h1>
      <span id="live-lbl" style="font-size:.8rem;color:#9a9087;"></span>
    </div>

    <!-- Alertes urgentes -->
    <div id="alert-overdue" style="display:none;" class="alert-banner alert-overdue">
      <span class="icon">🔴</span>
      <span class="txt" id="txt-overdue"></span>
      <a onclick="setFilter('a_rappeler')">Voir →</a>
    </div>
    <div id="alert-today" style="display:none;" class="alert-banner alert-today">
      <span class="icon">🔔</span>
      <span class="txt" id="txt-today"></span>
      <a onclick="setFilter('a_rappeler')">Voir →</a>
    </div>
    <div id="alert-rdv" style="display:none;" class="alert-banner alert-rdv">
      <span class="icon">📅</span>
      <span class="txt" id="txt-rdv"></span>
      <a onclick="setFilter('rdv_prevu')">Voir →</a>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box"><div class="lbl">À traiter</div><div class="val" style="color:#C4603A;" id="s-a_traiter">—</div></div>
      <div class="stat-box"><div class="lbl">À rappeler</div><div class="val" style="color:#d97706;" id="s-a_rappeler">—</div></div>
      <div class="stat-box"><div class="lbl">RDV prévus</div><div class="val" style="color:#7c3aed;" id="s-rdv_prevu">—</div></div>
      <div class="stat-box"><div class="lbl">Traités</div><div class="val" style="color:#059669;" id="s-traite">—</div></div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-head">
        <h2>Toutes les demandes</h2>
        <div class="filter-row">
          <button class="fb fb-active" data-f="all"        onclick="setFilter('all')">Tous</button>
          <button class="fb"           data-f="a_traiter"  onclick="setFilter('a_traiter')">À traiter</button>
          <button class="fb"           data-f="a_rappeler" onclick="setFilter('a_rappeler')">À rappeler</button>
          <button class="fb"           data-f="rappele"    onclick="setFilter('rappele')">Rappelé</button>
          <button class="fb"           data-f="rdv_prevu"  onclick="setFilter('rdv_prevu')">RDV prévu</button>
          <button class="fb"           data-f="traite"     onclick="setFilter('traite')">Traité</button>
          <button class="fb"           data-f="sans_suite" onclick="setFilter('sans_suite')">Sans suite</button>
          <input class="search-inp" type="search" placeholder="Nom, téléphone…" id="srch" oninput="render()">
        </div>
      </div>
      <div style="overflow-x:auto;">
        <div id="tbl-wrap"><div class="empty">Chargement…</div></div>
      </div>
    </div>
  </main>
</div>

<script>
  let allLeads = [];
  let activeFilter = 'all';
  const today    = new Date().toISOString().slice(0, 10);
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);

  const STATUTS = [
    { v: 'a_traiter',  l: 'À traiter',  cls: 's-a_traiter'  },
    { v: 'a_rappeler', l: 'À rappeler', cls: 's-a_rappeler' },
    { v: 'rappele',    l: 'Rappelé',    cls: 's-rappele'    },
    { v: 'rdv_prevu',  l: 'RDV prévu',  cls: 's-rdv_prevu'  },
    { v: 'traite',     l: 'Traité',     cls: 's-traite'     },
    { v: 'sans_suite', l: 'Sans suite', cls: 's-sans_suite' },
  ];

  function isDone(r) { return r.statut === 'traite' || r.statut === 'sans_suite'; }

  function rowPriority(r) {
    if (r.statut === 'a_rappeler') {
      if (r.rappel_prevu_le && r.rappel_prevu_le < today)  return 1; // en retard
      if (r.rappel_prevu_le && r.rappel_prevu_le === today) return 2; // aujourd'hui
      if (r.rappel_prevu_le) return 4; // futur
      return 5;
    }
    if (r.statut === 'rdv_prevu') {
      if (r.rdv_prevu_le && r.rdv_prevu_le <= tomorrow) return 3; // RDV proche
      if (r.rdv_prevu_le) return 6;
      return 7;
    }
    if (r.statut === 'a_traiter') return 8;
    if (r.statut === 'rappele')   return 9;
    return 10; // traite, sans_suite
  }

  function rowClass(r) {
    if (r.statut === 'a_rappeler') {
      if (r.rappel_prevu_le && r.rappel_prevu_le < today)  return 'row-overdue';
      if (r.rappel_prevu_le && r.rappel_prevu_le === today) return 'row-today';
    }
    if (r.statut === 'rdv_prevu' && r.rdv_prevu_le && r.rdv_prevu_le <= tomorrow) return 'row-rdv';
    return '';
  }

  async function load() {
    const data = await fetch('/admin/api/leads').then(r => r.json());
    allLeads = data.leads || [];
    refreshAlerts(data);
    refreshStats();
    render();
  }

  function refreshStats() {
    ['a_traiter','a_rappeler','rdv_prevu','traite'].forEach(s => {
      const el = document.getElementById('s-' + s);
      if (el) el.textContent = allLeads.filter(r => r.statut === s).length;
    });
    const actif = allLeads.filter(r => !isDone(r)).length;
    document.getElementById('live-lbl').textContent = actif > 0 ? `${actif} actif${actif>1?'s':''}` : 'Tout traité ✓';
  }

  function refreshAlerts(data) {
    const { retard_rappel = 0, today_rappel = 0, rdv_soon = 0 } = data || {};
    // On recalcule en live depuis allLeads au cas où load() est appelé sans data
    const ret = data ? retard_rappel : allLeads.filter(r => r.statut==='a_rappeler' && r.rappel_prevu_le && r.rappel_prevu_le < today).length;
    const tdy = data ? today_rappel  : allLeads.filter(r => r.statut==='a_rappeler' && r.rappel_prevu_le === today).length;
    const rdv = data ? rdv_soon      : allLeads.filter(r => r.statut==='rdv_prevu'  && r.rdv_prevu_le   && r.rdv_prevu_le <= tomorrow).length;

    setAlert('alert-overdue','txt-overdue', ret, `${ret} rappel${ret>1?'s':''} en retard`);
    setAlert('alert-today',  'txt-today',   tdy, `${tdy} rappel${tdy>1?'s':''} prévu${tdy>1?'s':''} aujourd'hui`);
    setAlert('alert-rdv',    'txt-rdv',     rdv, `${rdv} RDV prévu${rdv>1?'s':''} dans les 48h`);
  }

  function setAlert(wrapperId, txtId, count, msg) {
    const el = document.getElementById(wrapperId);
    if (!el) return;
    el.style.display = count > 0 ? 'flex' : 'none';
    if (count > 0) document.getElementById(txtId).textContent = msg;
  }

  function setFilter(f) {
    activeFilter = f;
    document.querySelectorAll('.fb').forEach(b => b.classList.toggle('fb-active', b.dataset.f === f));
    render();
  }

  function getVisible() {
    const q = (document.getElementById('srch')?.value || '').toLowerCase();
    let rows = activeFilter === 'all'
      ? allLeads
      : allLeads.filter(r => r.statut === activeFilter);
    if (q) rows = rows.filter(r =>
      (r.nom||'').toLowerCase().includes(q) ||
      (r.telephone||'').toLowerCase().includes(q) ||
      (r.email||'').toLowerCase().includes(q)
    );
    return [...rows].sort((a, b) => rowPriority(a) - rowPriority(b) || new Date(b.created_at) - new Date(a.created_at));
  }

  function renderDateCell(row) {
    if (row.statut === 'a_rappeler') {
      const isOvd  = row.rappel_prevu_le && row.rappel_prevu_le < today;
      const isTdy  = row.rappel_prevu_le === today;
      const cls    = 'date-inp' + (isOvd ? ' di-overdue' : isTdy ? ' di-today' : row.rappel_prevu_le ? ' di-future' : '');
      return `<span class="date-lbl lbl-rappel">📞 Rappel le</span>
        <input type="date" class="${cls}" value="${row.rappel_prevu_le||''}"
          onchange="patchField('${row.source_type}',${row.id},{rappel_prevu_le:this.value})">`;
    }
    if (row.statut === 'rdv_prevu') {
      const isSoon = row.rdv_prevu_le && row.rdv_prevu_le <= tomorrow;
      const cls    = 'date-inp' + (isSoon ? ' di-rdv-soon' : row.rdv_prevu_le ? ' di-rdv-future' : '');
      return `<span class="date-lbl lbl-rdv">📅 RDV le</span>
        <input type="date" class="${cls}" value="${row.rdv_prevu_le||''}"
          onchange="patchField('${row.source_type}',${row.id},{rdv_prevu_le:this.value})">`;
    }
    return '<span style="color:#ddd;font-size:.76rem;">—</span>';
  }

  function renderStatutSelect(row) {
    const opts = STATUTS.map(s =>
      `<option value="${s.v}" ${row.statut===s.v?'selected':''}>${s.l}</option>`
    ).join('');
    const cls  = STATUTS.find(s => s.v === row.statut)?.cls || 's-a_traiter';
    return `<select class="stat-sel ${cls}"
      onchange="patchStatus('${row.source_type}',${row.id},this.value,this)">${opts}</select>`;
  }

  function render() {
    const rows = getVisible();
    const wrap = document.getElementById('tbl-wrap');
    if (!rows.length) {
      wrap.innerHTML = '<div class="empty">Aucune demande pour ce filtre.</div>';
      return;
    }
    wrap.innerHTML = `<table>
      <thead><tr>
        <th>Nom</th>
        <th>Contact</th>
        <th>Message</th>
        <th>Date</th>
        <th>Commentaire</th>
        <th>Statut</th>
        <th></th>
      </tr></thead>
      <tbody>${rows.map(row => {
        const tag = row.source_type === 'contact'
          ? '<span class="type-tag tag-contact">Contact</span>'
          : '<span class="type-tag tag-rappel">Rappel</span>';
        const dateStr = new Date(row.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
        return `<tr class="${rowClass(row)}" id="r-${row.source_type}-${row.id}">
          <td>
            <div style="font-weight:600;font-size:.84rem;color:#1A1A16;">${esc(row.nom)||'—'}${tag}</div>
            <div style="font-size:.7rem;color:#aaa;margin-top:2px;">${dateStr}</div>
          </td>
          <td>
            ${row.telephone?`<div><a class="tel-link" href="tel:${esc(row.telephone)}">${esc(row.telephone)}</a></div>`:''}
            ${row.email?`<div style="margin-top:2px;"><a class="mail-link" href="mailto:${esc(row.email)}">${esc(row.email)}</a></div>`:''}
          </td>
          <td class="msg-cell" title="${esc(row.message)}">${esc(row.message)||'<span style="color:#ddd">—</span>'}</td>
          <td style="min-width:140px;">${renderDateCell(row)}</td>
          <td style="min-width:130px;">
            <textarea class="notes-ta" placeholder="Note libre…"
              onblur="patchField('${row.source_type}',${row.id},{notes:this.value})"
            >${esc(row.notes)}</textarea>
          </td>
          <td style="min-width:130px;">${renderStatutSelect(row)}</td>
          <td>
            <button class="del-btn" onclick="del('${row.source_type}',${row.id})" title="Supprimer">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
            </button>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
  }

  async function patchStatus(type, id, newStatut, sel) {
    const lead = allLeads.find(r => r.source_type === type && r.id === id);
    if (!lead) return;
    lead.statut = newStatut;
    // Update select class immediately
    const statDef = STATUTS.find(s => s.v === newStatut);
    if (sel && statDef) sel.className = `stat-sel ${statDef.cls}`;
    await fetch(`/admin/api/leads/${type}/${id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ statut: newStatut }),
    });
    // Re-render to update date cell and row color
    render();
    refreshStats();
    refreshAlerts(null);
  }

  async function patchField(type, id, fields) {
    const lead = allLeads.find(r => r.source_type === type && r.id === id);
    if (!lead) return;
    Object.assign(lead, fields);
    await fetch(`/admin/api/leads/${type}/${id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(fields),
    });
    // Update row class without full re-render (keeps focus)
    const row = document.getElementById(`r-${type}-${id}`);
    if (row) row.className = rowClass(lead);
    // Update date input class if needed
    const dateInp = row?.querySelector('.date-inp');
    if (dateInp) {
      const isRappel = lead.statut === 'a_rappeler';
      const isRdv    = lead.statut === 'rdv_prevu';
      const val      = isRappel ? lead.rappel_prevu_le : lead.rdv_prevu_le;
      dateInp.className = 'date-inp' + (
        isRappel && val && val < today  ? ' di-overdue' :
        isRappel && val === today       ? ' di-today'   :
        isRappel && val                 ? ' di-future'  :
        isRdv    && val && val <= tomorrow ? ' di-rdv-soon' :
        isRdv    && val                 ? ' di-rdv-future' : ''
      );
    }
    refreshStats();
    refreshAlerts(null);
  }

  async function del(type, id) {
    if (!confirm('Supprimer cette demande définitivement ?')) return;
    const row = document.getElementById(`r-${type}-${id}`);
    if (row) { row.style.opacity='.35';row.style.pointerEvents='none'; }
    const res = await fetch(`/admin/api/leads/${type}/${id}`, { method:'DELETE' });
    if (!res.ok) { if(row){row.style.opacity='1';row.style.pointerEvents='';} alert('Erreur lors de la suppression.'); return; }
    allLeads = allLeads.filter(r => !(r.source_type===type && r.id===id));
    render();
    refreshStats();
    refreshAlerts(null);
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  load();
  setInterval(load, 60000);
</script>
<script src="/js/admin-sidebar.js"></script>
</body>
</html>
